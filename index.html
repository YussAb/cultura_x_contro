<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultura X Contro Newsletter</title>
  <meta
    name="description"
    content="Sign up to the Cultura X Contro newsletter for future updates."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-shell" aria-label="Cultura X Contro newsletter signup">
    <p class="brand-mark" aria-hidden="true">Cultura X Contro</p>

    <section class="newsletter-popup" aria-labelledby="newsletter-title">
      <p class="newsletter-kicker">Newsletter</p>
      <h1 id="newsletter-title">Cultura X Contro</h1>
      <p class="newsletter-copy">
        I'll be happy to keep you updated if you sign up to the newsletter.
      </p>

      <form class="newsletter-form" name="newsletter" method="POST" data-netlify="true" netlify-honeypot="company" novalidate>
        <input type="hidden" name="form-name" value="newsletter">
        <input type="hidden" name="source_section" value="production-popup">
        <p class="hidden-field">
          <label>Company <input name="company" autocomplete="off"></label>
        </p>

        <label class="sr-only" for="newsletter-email">Email</label>
        <div class="form-row">
          <input
            id="newsletter-email"
            name="email"
            type="email"
            placeholder="Your email"
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            required
          >
          <button type="submit">Sign up</button>
        </div>
        <p class="form-feedback" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
